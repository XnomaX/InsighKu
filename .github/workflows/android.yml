name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      # Optional repository secret containing the contents of app/google-services.json.
      # The JSON is written only to the ephemeral runner and is never committed.
      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase configuration loaded from the repository secret."
          else
            echo "GOOGLE_SERVICES_JSON is not set; Firebase configuration will be omitted from this build."
          fi

      - name: Assemble debug APK
        run: |
          if [ -f app/google-services.json ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            # Compile and package the app without project-specific Firebase resources.
            ./gradlew :app:assembleDebug -x processDebugGoogleServices --no-daemon
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: InsighKu-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
