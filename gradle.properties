# Project-wide Gradle settings.
# IDE settings override this file.

# Heap: 2G is tight on 8GB RAM with Android Studio open - G1 reduces pause thrash.
# Don't push past 2G unless you close other apps; free RAM was ~1.3GB during audit.
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallel project execution (app + benchmark)
org.gradle.parallel=true

# Reuse task outputs across builds
org.gradle.caching=true

# Config cache already helps; keep it
org.gradle.configuration-cache=true

# Prefer daemon (default true; explicit)
org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Faster Kotlin/KSP incremental
kotlin.incremental=true
ksp.incremental=true